<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>A Favor o En Contra</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #07060d;
  --glass:     rgba(255,255,255,0.055);
  --glass-hi:  rgba(255,255,255,0.09);
  --border:    rgba(255,255,255,0.12);
  --fg:        #F4F2FF;
  --fg-muted:  #9a96bd;
  --p1:        #3ef0cf;
  --p1-dim:    rgba(62,240,207,0.14);
  --p2:        #ff5f7e;
  --p2-dim:    rgba(255,95,126,0.14);
  --gold:      #ffd25e;
  --violet:    #8b6bff;
  --agree:     var(--p1);
  --disagree:  var(--p2);
  --display:   'Syne', system-ui, sans-serif;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }

html { background: var(--bg) }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'DM Sans', system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  min-height: 100vh;
  min-height: 100dvh;
  padding-block: 22px 40px;
  padding-left:  max(16px, env(safe-area-inset-left,0px));
  padding-right: max(16px, env(safe-area-inset-right,0px));
  position: relative;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── Aurora background ── */
.aurora { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden }
.aurora i {
  position: absolute;
  width: 70vmax; height: 70vmax;
  border-radius: 50%;
  filter: blur(90px);
  opacity: .5;
  will-change: transform;
}
.aurora i:nth-child(1) { background: radial-gradient(circle, var(--p1), transparent 62%); left: -35vmax; top: -20vmax; animation: drift1 22s ease-in-out infinite alternate }
.aurora i:nth-child(2) { background: radial-gradient(circle, var(--p2), transparent 62%); right: -38vmax; bottom: -25vmax; animation: drift2 26s ease-in-out infinite alternate }
.aurora i:nth-child(3) { background: radial-gradient(circle, var(--violet), transparent 62%); left: 20vw; top: 30vh; opacity: .28; animation: drift3 30s ease-in-out infinite alternate }
@keyframes drift1 { to { transform: translate(25vmax, 18vmax) scale(1.15) } }
@keyframes drift2 { to { transform: translate(-22vmax, -16vmax) scale(1.1) } }
@keyframes drift3 { to { transform: translate(-18vw, 14vh) scale(1.25) } }

/* film grain */
body::after {
  content: '';
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  opacity: .07; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

.wrap {
  position: relative; z-index: 2;
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* ── Header ── */
.header { display: flex; align-items: center; justify-content: space-between; gap: 8px }
.header .logo { min-width: 0 }
.logo {
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(.7rem, 3.2vw, 1.3rem);
  white-space: nowrap;
  letter-spacing: -0.03em;
  background: linear-gradient(100deg, var(--p1), var(--gold) 50%, var(--p2));
  -webkit-background-clip: text; background-clip: text;
  color: transparent;
}
.logo span { color: var(--fg); -webkit-text-fill-color: var(--fg); font-weight: 700; opacity: .85 }

.stats { flex-shrink: 0; display: flex; gap: 5px; align-items: center; font-variant-numeric: tabular-nums }
.stat {
  font-size: 0.78rem; font-weight: 700; letter-spacing: 0.04em;
  padding: 5px 9px; border-radius: 100px;
  white-space: nowrap;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--border);
}
.stat-agree  { background: var(--p1-dim); color: var(--p1) }
.stat-debate { background: var(--p2-dim); color: var(--p2) }
.stat-sep    { display: none }

/* ── Progress ── */
.progress { height: 4px; background: var(--glass); border-radius: 100px; overflow: hidden }
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--p1), var(--gold), var(--p2));
  border-radius: 100px;
  box-shadow: 0 0 14px rgba(255,210,94,.7);
  transition: width .6s cubic-bezier(.4,0,.2,1);
}

/* ── Question card (gradient-border glass) ── */
.q-card {
  position: relative;
  border-radius: 28px;
  padding: 40px 26px 30px;
  text-align: center;
  overflow: hidden;
  border: 1px solid transparent;
  background:
    linear-gradient(160deg, rgba(20,17,38,.82), rgba(12,10,24,.78)) padding-box,
    linear-gradient(135deg, var(--p1), var(--violet) 50%, var(--p2)) border-box;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  box-shadow: 0 24px 60px -20px rgba(139,107,255,.45);
}
.q-card::before {
  content: '?';
  position: absolute; right: -10px; top: -46px;
  font-family: var(--display); font-weight: 800;
  font-size: 15rem; line-height: 1;
  color: rgba(255,255,255,.04);
  pointer-events: none;
}
.q-card::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 70% 45% at 50% -8%, rgba(255,210,94,.14), transparent);
}
.q-index {
  position: relative;
  font-size: 0.68rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 18px;
}
.q-text {
  position: relative;
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(1.45rem, 6vw, 2.05rem);
  line-height: 1.15;
  letter-spacing: -0.02em;
  text-wrap: balance;
}
.q-tag {
  position: relative;
  display: inline-block; margin-top: 20px;
  font-size: 0.66rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
  color: var(--fg-muted);
  background: var(--glass);
  border: 1px solid var(--border);
  padding: 5px 13px; border-radius: 100px;
}

/* ── Vote panels with VS badge ── */
.vote-grid { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
.vote-grid::after {
  content: 'VS';
  position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
  z-index: 3;
  width: 38px; height: 38px; border-radius: 50%;
  display: grid; place-items: center;
  font-family: var(--display); font-weight: 800; font-size: .72rem; letter-spacing: .02em;
  color: #0b0914;
  background: linear-gradient(135deg, var(--gold), #fff3c4);
  box-shadow: 0 0 0 5px rgba(7,6,13,.8), 0 0 24px rgba(255,210,94,.5);
}

.player-panel {
  --c: var(--p1); --c-dim: var(--p1-dim);
  position: relative;
  background: var(--glass);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 20px 12px 16px;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  overflow: hidden;
  transition: border-color .3s, box-shadow .3s, background .3s, transform .3s;
}
#panel2 { --c: var(--p2); --c-dim: var(--p2-dim) }
.player-panel::before {
  content: ''; position: absolute; left: 14%; right: 14%; top: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--c), transparent);
  box-shadow: 0 0 18px 2px var(--c);
}
.player-panel::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 90% 60% at 50% 0%, var(--c-dim), transparent 70%);
}
.player-panel.ready-p1, .player-panel.ready-p2 {
  border-color: var(--c);
  background: var(--c-dim);
  box-shadow: 0 0 36px -6px var(--c), inset 0 0 28px -12px var(--c);
  transform: translateY(-2px);
}

.p-label {
  position: relative; z-index: 1;
  font-family: var(--display); font-weight: 800;
  font-size: .8rem; letter-spacing: .14em; text-transform: uppercase;
}
.p-label-1 { color: var(--p1) }
.p-label-2 { color: var(--p2) }

.vote-btns { position: relative; z-index: 1; width: 100%; display: flex; flex-direction: column; gap: 8px }

.btn-vote {
  width: 100%;
  padding: 13px 8px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: var(--glass-hi);
  color: var(--fg);
  font-family: inherit; font-weight: 700; font-size: .9rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: transform .15s, background .15s, border-color .15s, box-shadow .15s, color .15s;
  min-width: 0;
  -webkit-tap-highlight-color: transparent;
}
.btn-vote:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px }
.btn-vote:disabled { pointer-events: none; opacity: .5 }
.btn-vote:active { transform: scale(.96) }
.p1 .btn-vote:hover { background: var(--c, var(--p1)); background: var(--p1); color: #04120f; border-color: var(--p1); box-shadow: 0 6px 24px -4px var(--p1); transform: translateY(-2px) }
.p2 .btn-vote:hover { background: var(--p2); color: #1a0309; border-color: var(--p2); box-shadow: 0 6px 24px -4px var(--p2); transform: translateY(-2px) }

.voted-display {
  width: 100%; text-align: center;
  padding: 22px 8px; border-radius: 14px;
  font-weight: 700; font-size: .85rem;
  border: 1px dashed var(--c);
  color: var(--c);
  background: rgba(0,0,0,.2);
  animation: seal .45s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes seal { from { transform: scale(.7) rotate(-4deg); opacity: 0 } to { transform: none; opacity: 1 } }

.p-status { position: relative; z-index: 1; font-size: .74rem; color: var(--fg-muted); min-height: 16px }

/* ── Reveal button ── */
.reveal-wrap { text-align: center }
.btn-reveal {
  padding: 17px 50px;
  color: #0b0914;
  font-family: var(--display); font-weight: 800; font-size: 1.05rem; letter-spacing: .01em;
  border: none; border-radius: 100px; cursor: pointer;
  background: linear-gradient(110deg, var(--p1), var(--gold), var(--p2), var(--gold), var(--p1));
  background-size: 300% 100%;
  box-shadow: 0 10px 40px -8px rgba(255,210,94,.55);
  transition: transform .15s, opacity .25s, filter .25s;
}
.btn-reveal:not(:disabled) { animation: shimmer 3.5s linear infinite, beat 1.6s ease-in-out infinite }
.btn-reveal:hover:not(:disabled) { transform: translateY(-3px) scale(1.03) }
.btn-reveal:active:not(:disabled) { transform: scale(.97) }
.btn-reveal:disabled { opacity: .22; cursor: not-allowed; filter: grayscale(.6) }
.btn-reveal:focus-visible { outline: 2px solid var(--fg); outline-offset: 4px }
@keyframes shimmer { to { background-position: -300% 0 } }
@keyframes beat { 50% { box-shadow: 0 10px 56px -4px rgba(255,210,94,.85) } }

/* ── Result card ── */
.result-card {
  --c: var(--agree);
  position: relative; overflow: hidden;
  border-radius: 28px;
  padding: 36px 22px 30px;
  text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  background: rgba(14,12,26,.75);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1.5px solid var(--c);
  box-shadow: 0 0 60px -10px var(--c), inset 0 0 50px -20px var(--c);
}
.result-card.disagree-card { --c: var(--disagree); animation: pop .35s cubic-bezier(.34,1.56,.64,1) both, shake .5s .3s ease-in-out }
.result-card::before {
  content: ''; position: absolute; inset: -40% -20% auto; height: 80%;
  background: radial-gradient(ellipse at center, var(--c), transparent 65%);
  opacity: .22; pointer-events: none;
}
.result-icon { position: relative; font-size: 3.6rem; line-height: 1; filter: drop-shadow(0 6px 22px var(--c)); animation: bob 2.4s ease-in-out infinite }
@keyframes bob { 50% { transform: translateY(-6px) rotate(-4deg) } }
@keyframes shake { 0%,100% { transform: translateX(0) } 20% { transform: translateX(-7px) } 40% { transform: translateX(6px) } 60% { transform: translateX(-4px) } 80% { transform: translateX(3px) } }

.result-verdict {
  position: relative;
  font-family: var(--display); font-weight: 800;
  font-size: 2rem; letter-spacing: -0.03em; line-height: 1;
  color: var(--c);
  text-shadow: 0 0 28px var(--c);
}

.votes-row { position: relative; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap }
.vote-chip { padding: 8px 16px; border-radius: 100px; font-weight: 700; font-size: .85rem; border: 1px solid currentColor }
.chip-p1 { background: var(--p1-dim); color: var(--p1) }
.chip-p2 { background: var(--p2-dim); color: var(--p2) }

.result-desc { position: relative; font-size: .92rem; color: var(--fg-muted); line-height: 1.6; max-width: 320px }

/* ── Next button ── */
.btn-next {
  width: 100%; padding: 17px;
  background: var(--glass-hi);
  border: 1px solid var(--border);
  border-radius: 18px;
  color: var(--fg);
  font-family: var(--display); font-weight: 800; font-size: 1rem; letter-spacing: .01em;
  cursor: pointer;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  transition: background .2s, border-color .2s, transform .15s, box-shadow .2s;
}
.btn-next:hover { background: var(--gold); color: #0b0914; border-color: var(--gold); transform: translateY(-2px); box-shadow: 0 10px 34px -8px var(--gold) }
.btn-next:active { transform: scale(.98) }
.btn-next:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px }

/* ── End screen ── */
.end-screen {
  text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 20px;
  padding: 34px 20px 30px;
  border-radius: 28px;
  border: 1px solid transparent;
  background:
    linear-gradient(160deg, rgba(20,17,38,.85), rgba(12,10,24,.8)) padding-box,
    linear-gradient(135deg, var(--p1), var(--gold) 50%, var(--p2)) border-box;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  box-shadow: 0 30px 80px -24px rgba(255,210,94,.4);
}
.end-trophy { font-size: 4rem; line-height: 1; filter: drop-shadow(0 8px 28px rgba(255,210,94,.7)); animation: bob 2.4s ease-in-out infinite }
.end-title {
  font-family: var(--display); font-weight: 800; font-size: 2.1rem; letter-spacing: -0.03em; text-wrap: balance;
  background: linear-gradient(100deg, var(--p1), var(--gold), var(--p2));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.end-subtitle { color: var(--fg-muted); font-size: .92rem }

.end-stats { display: flex; gap: 12px; width: 100%; max-width: 340px }
.end-stat { flex: 1; background: var(--glass); border: 1px solid var(--border); border-radius: 20px; padding: 20px 12px }
.end-num { font-family: var(--display); font-weight: 800; font-size: 3rem; line-height: 1; font-variant-numeric: tabular-nums }
.num-agree    { color: var(--agree);    text-shadow: 0 0 26px var(--agree) }
.num-disagree { color: var(--disagree); text-shadow: 0 0 26px var(--disagree) }
.end-stat-lbl { font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; color: var(--fg-muted); margin-top: 8px }

.end-msg { font-size: .95rem; color: var(--fg-muted); line-height: 1.65; max-width: 300px }

.btn-restart {
  padding: 16px 44px;
  background: linear-gradient(110deg, var(--p1), var(--gold), var(--p2));
  color: #0b0914;
  font-family: var(--display); font-weight: 800; font-size: 1rem;
  border: none; border-radius: 100px; cursor: pointer;
  box-shadow: 0 10px 36px -8px rgba(255,210,94,.6);
  transition: transform .15s;
}
.btn-restart:hover { transform: translateY(-2px) scale(1.04) }
.btn-restart:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px }

/* ── Confetti / burst ── */
.fx { position: fixed; inset: 0; z-index: 50; pointer-events: none; overflow: hidden }
.fx span {
  position: absolute; left: 50%; top: 55%;
  font-size: var(--s, 1.4rem);
  animation: burst var(--t, 1.1s) cubic-bezier(.15,.8,.3,1) forwards;
}
@keyframes burst {
  0%   { transform: translate(-50%,-50%) scale(.3) rotate(0); opacity: 1 }
  100% { transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1) rotate(var(--r)); opacity: 0 }
}

/* ── Animations ── */
@keyframes pop { from { transform: scale(.8); opacity: 0 } to { transform: scale(1); opacity: 1 } }
@keyframes slide-up { from { transform: translateY(18px) scale(.98); opacity: 0 } to { transform: none; opacity: 1 } }
.anim-pop   { animation: pop .35s cubic-bezier(.34,1.56,.64,1) both }
.anim-slide { animation: slide-up .4s cubic-bezier(.2,.8,.2,1) both }

@media (prefers-reduced-motion: reduce) {
  .aurora i, .btn-reveal, .result-icon, .end-trophy, .result-card, .timer-ring { animation: none !important }
  .anim-pop, .anim-slide { animation: none }
  .fx { display: none }
  * { transition-duration: 0ms !important }
}

@media (max-width: 380px) {
  .vote-grid { gap: 8px }
  .btn-vote { font-size: .82rem; padding: 12px 4px }
}

/* ── Mute button ── */
.btn-mute {
  width: 31px; height: 31px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--glass);
  color: var(--fg); font-size: .95rem; line-height: 1; cursor: pointer;
  display: grid; place-items: center; flex-shrink: 0;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  transition: transform .15s, background .15s;
}
.btn-mute:hover { background: var(--glass-hi); transform: scale(1.08) }
.btn-mute:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px }
.btn-mute.off { opacity: .55 }

/* ── Debate timer ── */
.timer {
  position: relative; width: 100%;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  margin-top: 6px; padding-top: 18px;
  border-top: 1px dashed rgba(255,255,255,.14);
}
.timer-ring { position: relative; width: 132px; height: 132px }
.timer-ring svg { width: 100%; height: 100%; transform: rotate(-90deg) }
.timer-ring circle { fill: none; stroke-width: 7; stroke-linecap: round }
.timer-ring .trk { stroke: rgba(255,255,255,.1) }
.timer-ring .bar {
  stroke: var(--c);
  stroke-dasharray: 326.7; stroke-dashoffset: 0;
  filter: drop-shadow(0 0 6px var(--c));
  transition: stroke-dashoffset .25s linear, stroke .3s;
}
.timer-time {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-family: var(--display); font-weight: 800; font-size: 2rem;
  font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
}
.timer.warn .bar { stroke: var(--gold) }
.timer.warn .timer-time { color: var(--gold) }
.timer.warn .timer-ring { animation: tpulse 1s ease-in-out infinite }
.timer.done .bar { stroke: var(--p2) }
.timer.done .timer-time { color: var(--p2); font-size: 1.15rem; text-shadow: 0 0 20px var(--p2) }
@keyframes tpulse { 50% { transform: scale(1.06) } }
.timer-btns { display: flex; gap: 8px }
.btn-timer {
  padding: 11px 20px; border-radius: 100px; cursor: pointer;
  border: 1px solid var(--border); background: var(--glass-hi); color: var(--fg);
  font-family: inherit; font-weight: 700; font-size: .85rem;
  transition: transform .15s, background .15s, color .15s;
}
.btn-timer.main { background: var(--gold); color: #0b0914; border-color: var(--gold) }
.btn-timer:hover { transform: translateY(-2px) }
.btn-timer:active { transform: scale(.96) }
.btn-timer:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px }
.timer-hint { font-size: .75rem; color: var(--fg-muted) }

#game { display: contents }

/* ── Menu / lobby ── */
.menu-card {
  position: relative; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; gap: 16px;
  padding: 38px 24px 28px; text-align: center;
  border-radius: 28px; border: 1px solid transparent;
  background:
    linear-gradient(160deg, rgba(20,17,38,.85), rgba(12,10,24,.8)) padding-box,
    linear-gradient(135deg, var(--p1), var(--violet) 50%, var(--p2)) border-box;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  box-shadow: 0 24px 60px -20px rgba(139,107,255,.45);
  margin-top: 4vh;
}
.menu-logo {
  font-family: var(--display); font-weight: 800;
  font-size: clamp(1.9rem, 9vw, 2.6rem); line-height: 1.02; letter-spacing: -0.04em;
  background: linear-gradient(100deg, var(--p1), var(--gold) 50%, var(--p2));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.menu-logo span { color: var(--fg); -webkit-text-fill-color: var(--fg); opacity: .85 }
.menu-sub { color: var(--fg-muted); font-size: .92rem; max-width: 300px; text-wrap: balance }
.menu-or { color: var(--fg-muted); font-size: .72rem; letter-spacing: .2em; text-transform: uppercase }

.btn-big {
  width: 100%; padding: 16px 18px; border: none; border-radius: 18px; cursor: pointer;
  display: flex; flex-direction: column; gap: 2px; align-items: center;
  background: linear-gradient(110deg, var(--p1), var(--gold), var(--p2));

let soundOn = true;
try { soundOn = localStorage.getItem('biri-sound') !== 'off'; } catch (e) {}
let actx = null;

function audio() {
  if (!soundOn) return null;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    return actx;
  } catch (e) { return null; }
}

function tone(freq, dur, { type = 'sine', vol = 0.15, at = 0, to = null } = {}) {
  const c = audio(); if (!c) return;
  const t = c.currentTime + at;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(c.destination);
  o.start(t); o.stop(t + dur + 0.05);
}

// ═══ TIMER DE DEBATE ═══
const DEBATE_MS = 120000;
const RING = 326.7;
let tmr = { id: null, endAt: 0, left: DEBATE_MS, running: false, lastSec: null };

function timerStop() {
  clearInterval(tmr.id);
  tmr = { id: null, endAt: 0, left: DEBATE_MS, running: false, lastSec: null };
}

function fmt(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function timerRender() {
  const box = document.getElementById('timer');
  if (!box) return;
  const done = tmr.left <= 0;
  box.classList.toggle('warn', !done && tmr.left <= 10000 && (tmr.running || tmr.left < DEBATE_MS));
  box.classList.toggle('done', done);
  document.getElementById('timerTime').textContent = done ? '¡Tiempo!' : fmt(tmr.left);
  document.getElementById('timerBar').style.strokeDashoffset = RING * (1 - tmr.left / DEBATE_MS);
  const main = document.getElementById('timerMain');
  main.textContent = done ? '↺ Otra vez' : tmr.running ? '⏸ Pausa' : (tmr.left < DEBATE_MS ? '▶ Seguir' : '▶ Empezar debate');
  document.getElementById('timerHint').textContent = done ? 'Se acabó. ¿Alguien logró convencer al otro?' : tmr.running ? 'Hablen por turnos. ¡Argumenten!' : tmr.left === DEBATE_MS ? 'Arranca en un instante…' : 'En pausa. Toquen para seguir.';
}

function timerTick() {
  tmr.left = tmr.endAt - Date.now();
  const sec = Math.ceil(tmr.left / 1000);
  if (tmr.left <= 0) {
    tmr.left = 0; tmr.running = false;
    clearInterval(tmr.id); tmr.id = null;
    sfx.alarm();
    burst(['⏰', '🔔', '💬'], 10);
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  } else if (sec !== tmr.lastSec) {
    tmr.lastSec = sec;
    if (sec <= 10) sfx.tick();
  }
  timerRender();
}

function timerSend() {
  if (mode === 'online') send({ t: 'timer', q: cur, running: tmr.running, left: tmr.left });
}

// Aplica el estado del timer que vino del otro celular
function timerApply(running, left) {
  clearInterval(tmr.id); tmr.id = null;
  tmr.left = left; tmr.running = running; tmr.lastSec = null;
  if (running) { sfx.start(); tmr.endAt = Date.now() + left; tmr.id = setInterval(timerTick, 200); }
  timerRender();
}

// Arranca solo al mostrarse el "¡A debatir!". No se sincroniza por red:
// los dos celulares revelan a la vez y cada uno lo arranca por su cuenta.
function timerAuto() {
  const q = cur;
  setTimeout(() => {
    if (q !== cur || tmr.running || tmr.left !== DEBATE_MS || !document.getElementById('timer')) return;
    sfx.start();
    tmr.endAt = Date.now() + tmr.left;
    tmr.running = true;
    tmr.id = setInterval(timerTick, 200);
    timerRender();
  }, 1200);
}

function timerToggle() {
  if (tmr.left <= 0) tmr.left = DEBATE_MS;           // reiniciar tras terminar
  if (tmr.running) {                                   // pausar
    clearInterval(tmr.id); tmr.id = null;
    tmr.running = false;
  } else {                                             // empezar / seguir
    sfx.start();
    tmr.endAt = Date.now() + tmr.left;
    tmr.running = true;
    tmr.id = setInterval(timerTick, 200);
  }
  timerRender();
  timerSend();
}

function timerReset() {
  clearInterval(tmr.id);
  tmr = { id: null, endAt: 0, left: DEBATE_MS, running: false, lastSec: null };
  timerRender();
  timerSend();
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const TOTAL = 15;
let deck = [];
let cur = 0;
let votes = { 1: null, 2: null };
let score = { agree: 0, debate: 0 };
let revealed = false;

// Modo de juego: 'local' (un celular) u 'online' (dos celulares)
let mode = 'local';
let me = 1;                 // número de jugador propio en modo online
let pending = {};           // votos del otro que llegaron antes de que yo llegue a esa pregunta
let pendingNext = null;
let revealTimer = null;

// Preguntas ya usadas en esta sesión, para no repetirlas al jugar otras 15
let seen = new Set();

function newDeckIdx() {
  const all = [...QUESTIONS.keys()];
  const pool = all.filter(i => !seen.has(i));
  let idx;
  if (pool.length >= TOTAL) {
    idx = shuffle(pool).slice(0, TOTAL);
  } else {
    // Quedan pocas sin usar: van todas, y se completa con un ciclo nuevo
    idx = shuffle(pool);
    const rest = shuffle(all.filter(i => !idx.includes(i))).slice(0, TOTAL - idx.length);
    idx = idx.concat(rest);
    seen = new Set();
  }
  idx.forEach(i => seen.add(i));
  return idx;
}

function init(idx) {
  timerStop();
  syncMute();
  clearTimeout(revealTimer);
  pending = {}; pendingNext = null;
  deck = (idx || newDeckIdx()).map(i => QUESTIONS[i]);
  cur = 0;
  votes = { 1: null, 2: null };
  score = { agree: 0, debate: 0 };
  revealed = false;
  updateStats();
  renderQuestion();
}

function updateStats() {
  document.getElementById('statAgree').textContent  = '🤝 ' + score.agree;
  document.getElementById('statDebate').textContent = '⚔️ ' + score.debate;
  document.getElementById('progressFill').style.width = (cur / TOTAL * 100) + '%';
}

function renderQuestion() {
  const q = deck[cur];
  document.getElementById('qIndex').textContent = `PREGUNTA ${cur + 1} / ${TOTAL}`;
  document.getElementById('qText').textContent  = q.text;
  document.getElementById('qTag').textContent   = q.cat;

  timerStop();
  clearTimeout(revealTimer);

  // Reset vote state
  votes = { 1: null, 2: null };
  revealed = false;

  // Reset player panels
  for (const p of [1, 2]) {
    const panel = document.getElementById('panel' + p);
    panel.classList.remove('ready-p1', 'ready-p2');

    const mine = mode === 'local' || p === me;
    document.getElementById('btns' + p).innerHTML = mine
      ? `<button class="btn-vote p${p}" onclick="castVote(${p},'favor')">👍 A favor</button>
         <button class="btn-vote p${p}" onclick="castVote(${p},'contra')">👎 En contra</button>`
      : `<div class="voted-display wait">⏳ Pensando…</div>`;

    document.getElementById('status' + p).textContent = mine ? 'Elige tu posición' : '';
    panel.querySelector('.p-label').textContent = mode === 'online' ? (p === me ? 'Vos · J' : 'Pareja · J') + p : 'Jugador ' + p;
  }

  document.getElementById('btnReveal').disabled = true;
  document.getElementById('resultArea').innerHTML = '';
  document.getElementById('btnNext').hidden = true;
  document.getElementById('voteGrid').hidden  = false;
  document.getElementById('revealWrap').hidden = mode === 'online';

  // Animate card in
  const card = document.getElementById('qCard');
  card.classList.remove('anim-slide');
  void card.offsetWidth;
  card.classList.add('anim-slide');

  // Voto del otro que llegó antes de que yo mostrara esta pregunta
  if (mode === 'online' && pending[cur] !== undefined) {
    const v = pending[cur]; delete pending[cur];
    remoteVote(v);
  }
}

function castVote(player, choice) {
  if (votes[player] !== null || revealed) return;
  if (mode === 'online' && player !== me) return;
  votes[player] = choice;
  sfx.vote(player);
  if (mode === 'online') send({ t: 'vote', q: cur, v: choice });

  const panel  = document.getElementById('panel' + player);
  const btnsEl = document.getElementById('btns' + player);
  const status = document.getElementById('status' + player);

  panel.classList.add('ready-p' + player);
  status.textContent = '✓ Voto registrado';

  // Replace buttons with sealed display — hides choice until reveal
  btnsEl.innerHTML =
    `<div class="voted-display voted-display-${player}">🔒 Esperando al otro...</div>`;

  if (votes[1] !== null && votes[2] !== null) bothVoted();
}

function bothVoted() {
  document.getElementById('status1').textContent = '¡Listos!';
  document.getElementById('status2').textContent = '¡Listos!';
  setTimeout(sfx.ready, 250);
  if (mode === 'online') {
    // En online no hay botón: se revela solo, a la vez en los dos celulares
    clearTimeout(revealTimer);
    revealTimer = setTimeout(revealVotes, 1100);
  } else {
    document.getElementById('btnReveal').disabled = false;
  }
}

// El otro jugador votó (online). Solo guardamos el voto; se ve recién al revelar.
function remoteVote(v) {
  const other = 3 - me;
  if (votes[other] !== null || revealed) return;
  votes[other] = v;
  document.getElementById('panel' + other).classList.add('ready-p' + other);
  document.getElementById('status' + other).textContent = '✓ Ya votó';
  document.getElementById('btns' + other).innerHTML = '<div class="voted-display wait">🔒 Ya votó</div>';
  sfx.vote(other);
  if (votes[1] !== null && votes[2] !== null) bothVoted();
}

function revealVotes() {
  if (!votes[1] || !votes[2] || revealed) return;
  clearTimeout(revealTimer);
  revealed = true;

  document.getElementById('voteGrid').hidden   = true;
  document.getElementById('revealWrap').hidden = true;

  const v1 = votes[1];
  const v2 = votes[2];
  const agree = v1 === v2;

  if (agree) score.agree++;
  else       score.debate++;
  updateStats();

  const icon    = agree ? '🤝' : '⚔️';
  const verdict = agree ? '¡De acuerdo!' : '¡A debatir!';
  const cls     = agree ? 'agree' : 'disagree';
  const desc    = agree
    ? 'Los dos piensan igual. Cuenten por qué están de acuerdo.'
    : 'Opiniones opuestas. Tienen 2 minutos para convencerse mutuamente.';

  const choiceLabel = c => c === 'favor' ? '👍 A favor' : '👎 En contra';

  document.getElementById('resultArea').innerHTML = `
    <div class="result-card ${cls}-card anim-pop">
      <div class="result-icon">${icon}</div>
      <div class="result-verdict ${cls}-text">${verdict}</div>
      <div class="votes-row">
        <span class="vote-chip chip-p1">J1: ${choiceLabel(v1)}</span>
        <span class="vote-chip chip-p2">J2: ${choiceLabel(v2)}</span>
      </div>
      <div class="result-desc">${desc}</div>
      ${agree ? '' : `
      <div class="timer" id="timer">
        <div class="timer-ring">
          <svg viewBox="0 0 120 120" aria-hidden="true"><circle class="trk" cx="60" cy="60" r="52"/><circle class="bar" id="timerBar" cx="60" cy="60" r="52"/></svg>
          <div class="timer-time" id="timerTime" role="timer" aria-live="off">2:00</div>
        </div>
        <div class="timer-btns">
          <button class="btn-timer main" id="timerMain" onclick="timerToggle()">▶ Empezar debate</button>
          <button class="btn-timer" onclick="timerReset()" aria-label="Reiniciar timer">↺</button>
        </div>
        <div class="timer-hint" id="timerHint"></div>
      </div>`}
    </div>`;

  document.getElementById('btnNext').hidden = false;
  if (!agree) { timerRender(); timerAuto(); }
  agree ? sfx.agree() : sfx.debate();
  burst(agree ? ['🎉','✨','💚','🤝','⭐'] : ['⚡','🔥','💥','⚔️','🗯️'], agree ? 26 : 18);

  // El otro ya tocó "Siguiente" antes de que yo terminara de revelar
  if (pendingNext === cur + 1) { pendingNext = null; nextQuestion(true); }
}

function burst(set, n) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const fx = document.getElementById('fx');
  for (let i = 0; i < n; i++) {
    const el = document.createElement('span');
    const ang = Math.random() * Math.PI * 2;
    const dist = 90 + Math.random() * Math.min(innerWidth, 520) * 0.55;
    el.textContent = set[i % set.length];
    el.style.setProperty('--x', Math.cos(ang) * dist + 'px');
    el.style.setProperty('--y', Math.sin(ang) * dist - 60 + 'px');
    el.style.setProperty('--r', (Math.random() * 540 - 270) + 'deg');
    el.style.setProperty('--s', (1 + Math.random() * 1.2) + 'rem');
    el.style.setProperty('--t', (0.9 + Math.random() * 0.7) + 's');
    fx.appendChild(el);
    setTimeout(() => el.remove(), 1800);
  }
}

function nextQuestion(fromRemote) {
  timerStop();
  sfx.next();
  if (mode === 'online' && fromRemote !== true) send({ t: 'next', to: cur + 1 });
  cur++;
  if (cur >= TOTAL) {
    showEnd();
  } else {
    renderQuestion();
  }
}

function showEnd() {
  document.getElementById('qCard').hidden    = true;
  document.getElementById('voteGrid').hidden = true;
  document.getElementById('revealWrap').hidden = true;
  document.getElementById('resultArea').innerHTML = '';
  document.getElementById('btnNext').hidden  = true;
  document.getElementById('progressFill').style.width = '100%';

  const pct = Math.round(score.agree / TOTAL * 100);
  const msg = score.agree > score.debate
    ? '¡Mucho en común! Son más parecidos de lo que creen.'
    : score.debate > score.agree
      ? '¡Choque de ideas! Eso hace que la conversación nunca sea aburrida.'
      : 'Mitad acuerdos, mitad debates. Balance perfecto.';

  timerStop();
  sfx.end();
  burst(['🏆','🎉','✨','⭐','🎊'], 36);
  document.getElementById('endArea').innerHTML = `
    <div class="end-screen anim-pop">
      <div class="end-trophy">🏆</div>
      <div class="end-title">¡Juego terminado!</div>
      <div class="end-subtitle">${pct}% de las rondas estuvieron de acuerdo</div>
      <div class="end-stats">
        <div class="end-stat">
          <div class="end-num num-agree">${score.agree}</div>
          <div class="end-stat-lbl">De acuerdo</div>
        </div>
        <div class="end-stat">
          <div class="end-num num-disagree">${score.debate}</div>
          <div class="end-stat-lbl">Debates</div>
        </div>
      </div>
      <div class="end-msg">${msg}</div>
      ${endButtons()}
    </div>`;
}

function endButtons() {
  const again = '<button class="btn-restart" onclick="restartGame()">Jugar de nuevo</button>';
  if (mode === 'local') return again + '<button class="btn-link" onclick="leaveRoom()">Volver al inicio</button>';
  return (me === 1 ? again : '<div class="end-msg">Esperando a que el Jugador 1 inicie otra partida…</div>')
       + '<button class="btn-link" onclick="leaveRoom()">Salir de la sala</button>';
}

function restartGame() {
  document.getElementById('qCard').hidden = false;
  document.getElementById('endArea').innerHTML = '';
  if (mode === 'online') {
    const idx = freshDeck();
    send({ t: 'restart', deck: idx });
    init(idx);
  } else {
    init();
  }
}


// ═══════════════════════════════════════════════════════════
//  MODO ONLINE (2 celulares) — WebRTC con PeerJS
// ═══════════════════════════════════════════════════════════
const ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // sin 0/O/1/I para evitar confusiones
const ICE = { iceServers: [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
  { urls: ['turn:openrelay.metered.ca:80', 'turn:openrelay.metered.ca:443', 'turn:openrelay.metered.ca:443?transport=tcp'],
    username: 'openrelayproject', credential: 'openrelayproject' }   // relay público de respaldo
] };
const PEER_OPTS = Object.assign({ config: ICE, debug: 0 }, window.PEER_OPTS || {});

let peer = null, conn = null, roomCode = '', leaving = false, joinTimeout = null;

const peerId  = c => 'biri-biri-' + c;
const genCode = () => Array.from({ length: 4 }, () => ALPHA[Math.floor(Math.random() * ALPHA.length)]).join('');
const freshDeck = newDeckIdx;
const roomUrl = c => location.origin + location.pathname + '?sala=' + c;

function send(msg) { try { if (conn && conn.open) conn.send(msg); } catch (e) {} }

function showMenu(view, d = {}) {
  const m = document.getElementById('menu');
  document.getElementById('game').hidden = true;
  document.getElementById('roomBar').hidden = true;
  m.hidden = false;
  let html = '';
  if (view === 'home') {
    html = `
      <div class="menu-card anim-slide">
        <div class="menu-logo">A Favor <span>o</span> En Contra</div>
        <p class="menu-sub">Descubran cuánto piensan igual… o cuánto les gusta discutir.</p>
        <button class="btn-big" onclick="createRoom()">🌐 Crear sala<small>para jugar desde 2 celulares</small></button>
        <div class="join-row">
          <input id="joinCode" maxlength="4" placeholder="CÓDIGO" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Código de sala"
                 oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')" onkeydown="if(event.key==='Enter')joinFromInput()">
          <button class="btn-ghost" onclick="joinFromInput()">Unirme</button>
        </div>
        <div class="menu-or">o</div>
        <button class="btn-ghost wide" onclick="startLocal()">📱 Jugar en un solo celular</button>
      </div>`;
  } else if (view === 'host') {
    html = `
      <div class="menu-card anim-slide">
        <div class="menu-sub">Código de sala</div>
        <div class="room-code">${d.code}</div>
        <div class="qr" id="qr"></div>
        <button class="btn-big" id="btnShare" onclick="shareRoom()">📤 Compartir link</button>
        <div class="wait-pulse">Esperando a tu pareja…</div>
        <button class="btn-link" onclick="leaveRoom()">Cancelar</button>
      </div>`;
  } else if (view === 'busy') {
    html = `
      <div class="menu-card anim-slide">
        <div class="wait-pulse">${d.text}</div>
        <button class="btn-link" onclick="leaveRoom()">Cancelar</button>
      </div>`;
  } else if (view === 'error') {
    html = `
      <div class="menu-card anim-slide">
        <div style="font-size:2.4rem">😕</div>
        <div class="menu-error">${d.msg}</div>
        <button class="btn-big" onclick="leaveRoom()">Volver al inicio</button>
      </div>`;
  }
  m.innerHTML = html;
  if (view === 'host') {
    try {
      const qr = qrcode(0, 'M'); qr.addData(roomUrl(d.code)); qr.make();
      document.getElementById('qr').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
    } catch (e) { document.getElementById('qr').hidden = true; }
  }
}

function startLocal() {
  mode = 'local'; me = 1; seen = new Set();
  document.getElementById('menu').hidden = true;
  document.getElementById('roomBar').hidden = true;
  document.getElementById('game').hidden = false;
  document.getElementById('qCard').hidden = false;
  document.getElementById('endArea').innerHTML = '';
  init();
}

function joinFromInput() {
  const c = (document.getElementById('joinCode').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (c.length !== 4) { document.getElementById('joinCode').focus(); return; }
  joinRoom(c);
}

function cleanupNet() {
  clearTimeout(joinTimeout);
  try { if (conn) conn.close(); } catch (e) {}
  try { if (peer) peer.destroy(); } catch (e) {}
  conn = null; peer = null;
}

function netError(err) {
  if (leaving) return;
  const t = err && err.type;
  const msg =
    t === 'peer-unavailable' ? 'No encontramos esa sala. Revisá el código y que tu pareja siga con la pantalla abierta.' :
    t === 'timeout'          ? 'No se pudo establecer la conexión. Probá con la misma red WiFi o volvé a intentar.' :
    (t === 'network' || t === 'server-error' || t === 'socket-error' || t === 'socket-closed')
                             ? 'No pudimos contactar al servidor de conexión. Revisá tu internet.' :
                               'Falló la conexión. Probá de nuevo.';
  cleanupNet();
  showMenu('error', { msg });
}

function wireConn(c) {
  c.on('data', onMsg);
  c.on('close', () => { if (!leaving) { cleanupNet(); showMenu('error', { msg: 'Se desconectó la otra persona.' }); } });
  c.on('error', netError);
}

function createRoom(tries = 0) {
  if (typeof Peer === 'undefined') { showMenu('error', { msg: 'No se pudo cargar el modo online.' }); return; }
  cleanupNet(); leaving = false;
  me = 1; roomCode = genCode(); seen = new Set();
  showMenu('busy', { text: 'Creando sala…' });
  peer = new Peer(peerId(roomCode), PEER_OPTS);
  peer.on('open', () => showMenu('host', { code: roomCode }));
  peer.on('connection', c => {
    if (conn && conn.open) { c.on('open', () => c.close()); return; }   // sala de 2: rechaza a un tercero
    conn = c; wireConn(c);
    c.on('open', () => { const idx = freshDeck(); send({ t: 'start', deck: idx }); beginOnline(idx); });
  });
  peer.on('disconnected', () => { try { if (peer && !peer.destroyed) peer.reconnect(); } catch (e) {} });
  peer.on('error', err => {
    if (err.type === 'unavailable-id' && tries < 5) { createRoom(tries + 1); return; }   // código ocupado: probar otro
    netError(err);
  });
}

function joinRoom(code) {
  if (typeof Peer === 'undefined') { showMenu('error', { msg: 'No se pudo cargar el modo online.' }); return; }
  cleanupNet(); leaving = false;
  me = 2; roomCode = code;
  showMenu('busy', { text: 'Conectando a la sala ' + code + '…' });
  peer = new Peer(PEER_OPTS);
  peer.on('open', () => {
    conn = peer.connect(peerId(code), { reliable: true });
    wireConn(conn);
    joinTimeout = setTimeout(() => netError({ type: 'timeout' }), 15000);
  });
  peer.on('disconnected', () => { try { if (peer && !peer.destroyed) peer.reconnect(); } catch (e) {} });
  peer.on('error', netError);
}

function beginOnline(idx) {
  clearTimeout(joinTimeout);
  mode = 'online';
  document.getElementById('menu').hidden = true;
  document.getElementById('game').hidden = false;
  document.getElementById('qCard').hidden = false;
  document.getElementById('endArea').innerHTML = '';
  const bar = document.getElementById('roomBar');
  bar.innerHTML = `🟢 Sala <b>${roomCode}</b> · Sos el <b style="color:var(--p${me})">Jugador ${me}</b> · <button class="btn-link" onclick="leaveRoom()">Salir</button>`;
  bar.hidden = false;
  sfx.start();
  init(idx);
}

function leaveRoom() {
  leaving = true;
  cleanupNet();
  timerStop(); clearTimeout(revealTimer);
  mode = 'local'; me = 1; seen = new Set();
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  showMenu('home');
}

function onMsg(m) {
  if (!m || typeof m !== 'object') return;
  switch (m.t) {
    case 'start':
      if (Array.isArray(m.deck)) beginOnline(m.deck.map(Number).filter(i => QUESTIONS[i]));
      break;
    case 'vote':
      if (m.q === cur) remoteVote(m.v);
      else if (m.q > cur) pending[m.q] = m.v;
      break;
    case 'next':
      if (m.to === cur + 1) { if (revealed) nextQuestion(true); else pendingNext = m.to; }
      break;
    case 'timer':
      if (m.q === cur) timerApply(!!m.running, Number(m.left) || 0);
      break;
    case 'restart':
      if (Array.isArray(m.deck)) {
        document.getElementById('qCard').hidden = false;
        document.getElementById('endArea').innerHTML = '';
        sfx.start();
        init(m.deck.map(Number).filter(i => QUESTIONS[i]));
      }
      break;
  }
}

async function shareRoom() {
  const url = roomUrl(roomCode), btn = document.getElementById('btnShare');
  try {
    if (navigator.share) { await navigator.share({ title: 'A Favor o En Contra', text: 'Entrá a mi sala (' + roomCode + ')', url }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  try {
    await navigator.clipboard.writeText(url);
    btn.innerHTML = '✓ Link copiado';
    setTimeout(() => { if (btn) btn.innerHTML = '📤 Compartir link'; }, 2000);
  } catch (e) { prompt('Copiá este link y pasaselo a tu pareja:', url); }
}

addEventListener('pagehide', () => { leaving = true; cleanupNet(); });

function boot() {
  const c = new URLSearchParams(location.search).get('sala');
  if (c && /^[A-Za-z0-9]{4}$/.test(c)) joinRoom(c.toUpperCase());
  else showMenu('home');
}
boot();
</script>
