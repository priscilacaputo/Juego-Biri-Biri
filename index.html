<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>A Favor o En Contra</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<style>
/* Layout: single-column centered stack, full-width vote panel grid */
:root {
  --bg:        #0C0C10;
  --surface:   #16161E;
  --border:    rgba(255,255,255,0.09);
  --fg:        #EEEEF5;
  --fg-muted:  #7272A0;
  --p1:        #3ECFB2;   /* teal — player 1 */
  --p1-dim:    rgba(62,207,178,0.12);
  --p2:        #FF6E6E;   /* coral — player 2 */
  --p2-dim:    rgba(255,110,110,0.12);
  --gold:      #FFC94D;
  --agree:     #3ECFB2;
  --disagree:  #FF6E6E;
  color-scheme: dark;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:       #F2F2FA;
    --surface:  #FFFFFF;
    --border:   rgba(0,0,0,0.09);
    --fg:       #0C0C10;
    --fg-muted: #7272A0;
    --p1-dim:   rgba(62,207,178,0.14);
    --p2-dim:   rgba(255,110,110,0.14);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg:       #F2F2FA;
  --surface:  #FFFFFF;
  --border:   rgba(0,0,0,0.09);
  --fg:       #0C0C10;
  --fg-muted: #7272A0;
  --p1-dim:   rgba(62,207,178,0.14);
  --p2-dim:   rgba(255,110,110,0.14);
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'DM Sans', system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  padding-block: 20px 32px;
  padding-left:  max(16px, env(safe-area-inset-left,0px));
  padding-right: max(16px, env(safe-area-inset-right,0px));
  min-height: 100%;
}

.wrap {
  max-width: 540px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* ── Header ── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.logo {
  font-family: 'Syne', system-ui, sans-serif;
  font-weight: 800;
  font-size: 1.25rem;
  letter-spacing: -0.02em;
}
.logo span { color: var(--gold) }

.stats {
  display: flex;
  gap: 8px;
  align-items: center;
  font-variant-numeric: tabular-nums;
}
.stat {
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  padding: 4px 11px;
  border-radius: 100px;
}
.stat-agree  { background: var(--p1-dim); color: var(--p1) }
.stat-debate { background: var(--p2-dim); color: var(--p2) }
.stat-sep    { color: var(--fg-muted); font-size: 0.75rem }

/* ── Progress ── */
.progress {
  height: 3px;
  background: var(--border);
  border-radius: 100px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--p1), var(--gold), var(--p2));
  background-size: 300% 100%;
  border-radius: 100px;
  transition: width 0.5s cubic-bezier(.4,0,.2,1);
}

/* ── Question card ── */
.q-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 28px 24px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.q-card::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(255,201,77,0.07), transparent);
  pointer-events: none;
}
.q-index {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--fg-muted);
  margin-bottom: 14px;
}
.q-text {
  font-family: 'Syne', system-ui, sans-serif;
  font-weight: 700;
  font-size: clamp(1.25rem, 4.5vw, 1.75rem);
  line-height: 1.25;
  text-wrap: balance;
  color: var(--fg);
}
.q-tag {
  display: inline-block;
  margin-top: 14px;
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--fg-muted);
  border: 1px solid var(--border);
  padding: 3px 10px;
  border-radius: 100px;
}

/* ── Vote panels ── */
.vote-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.player-panel {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 16px;
  padding: 18px 14px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  transition: border-color 0.25s;
}
.player-panel.ready-p1 { border-color: var(--p1) }
.player-panel.ready-p2 { border-color: var(--p2) }

.p-label {
  font-family: 'Syne', system-ui, sans-serif;
  font-weight: 800;
  font-size: 0.8rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.p-label-1 { color: var(--p1) }
.p-label-2 { color: var(--p2) }

.vote-btns {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.btn-vote {
  width: 100%;
  padding: 10px 8px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: transparent;
  color: var(--fg);
  font-family: 'DM Sans', system-ui, sans-serif;
  font-weight: 700;
  font-size: 0.88rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
  min-width: 0;
}
.btn-vote:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px }
.btn-vote:disabled      { pointer-events: none; opacity: 0.5 }

.p1 .btn-vote:hover { background: var(--p1-dim); border-color: var(--p1) }
.p2 .btn-vote:hover { background: var(--p2-dim); border-color: var(--p2) }

.voted-display {
  width: 100%;
  text-align: center;
  padding: 14px 8px;
  border-radius: 10px;
  font-weight: 700;
  font-size: 0.85rem;
}
.voted-display-1 { background: var(--p1-dim); color: var(--p1) }
.voted-display-2 { background: var(--p2-dim); color: var(--p2) }

.p-status {
  font-size: 0.75rem;
  color: var(--fg-muted);
  min-height: 16px;
}

/* ── Reveal button ── */
.reveal-wrap {
  text-align: center;
}
.btn-reveal {
  padding: 15px 44px;
  background: var(--gold);
  color: #0C0C10;
  font-family: 'Syne', system-ui, sans-serif;
  font-weight: 800;
  font-size: 1rem;
  letter-spacing: 0.01em;
  border: none;
  border-radius: 100px;
  cursor: pointer;
  box-shadow: 0 0 32px rgba(255,201,77,0.25);
  transition: transform 0.12s, box-shadow 0.2s, opacity 0.2s;
}
.btn-reveal:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 4px 40px rgba(255,201,77,0.4);
}
.btn-reveal:active:not(:disabled) { transform: translateY(0) }
.btn-reveal:disabled { opacity: 0.25; cursor: not-allowed }
.btn-reveal:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px }

/* ── Result card ── */
.result-card {
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: 20px;
  padding: 28px 20px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.result-card.agree-card    { border-color: var(--agree);    background: rgba(62,207,178,0.05) }
.result-card.disagree-card { border-color: var(--disagree); background: rgba(255,110,110,0.05) }

.result-icon { font-size: 2.5rem; line-height: 1 }

.result-verdict {
  font-family: 'Syne', system-ui, sans-serif;
  font-weight: 800;
  font-size: 1.5rem;
  letter-spacing: -0.02em;
}
.result-verdict.agree-text    { color: var(--agree) }
.result-verdict.disagree-text { color: var(--disagree) }

.votes-row {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}
.vote-chip {
  padding: 7px 16px;
  border-radius: 100px;
  font-weight: 700;
  font-size: 0.85rem;
}
.chip-p1 { background: var(--p1-dim); color: var(--p1) }
.chip-p2 { background: var(--p2-dim); color: var(--p2) }

.result-desc {
  font-size: 0.88rem;
  color: var(--fg-muted);
  line-height: 1.6;
  max-width: 320px;
}

/* ── Next button ── */
.btn-next {
  width: 100%;
  padding: 15px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  color: var(--fg);
  font-family: 'Syne', system-ui, sans-serif;
  font-weight: 700;
  font-size: 0.95rem;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
  letter-spacing: 0.01em;
}
.btn-next:hover { background: rgba(255,255,255,0.04); border-color: var(--gold) }
.btn-next:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px }

/* ── End screen ── */
.end-screen {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  padding: 12px 0;
}
.end-trophy { font-size: 3.5rem; line-height: 1 }
.end-title {
  font-family: 'Syne', system-ui, sans-serif;
  font-weight: 800;
  font-size: 1.9rem;
  letter-spacing: -0.03em;
  text-wrap: balance;
}
.end-subtitle { color: var(--fg-muted); font-size: 0.9rem }

.end-stats {
  display: flex;
  gap: 10px;
  width: 100%;
  max-width: 320px;
}
.end-stat {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px 12px;
}
.end-num {
  font-family: 'Syne', system-ui, sans-serif;
  font-weight: 800;
  font-size: 2.4rem;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.num-agree    { color: var(--agree) }
.num-disagree { color: var(--disagree) }
.end-stat-lbl { font-size: 0.75rem; color: var(--fg-muted); margin-top: 4px }

.end-msg {
  font-size: 0.95rem;
  color: var(--fg-muted);
  line-height: 1.65;
  max-width: 300px;
}

.btn-restart {
  padding: 14px 40px;
  background: var(--gold);
  color: #0C0C10;
  font-family: 'Syne', system-ui, sans-serif;
  font-weight: 800;
  font-size: 0.95rem;
  border: none;
  border-radius: 100px;
  cursor: pointer;
  transition: transform 0.12s;
}
.btn-restart:hover { transform: scale(1.03) }
.btn-restart:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px }

/* ── Animations ── */
@keyframes pop { from { transform:scale(0.82);opacity:0 } to { transform:scale(1);opacity:1 } }
@keyframes slide-up { from { transform:translateY(14px);opacity:0 } to { transform:translateY(0);opacity:1 } }
.anim-pop { animation: pop 0.3s cubic-bezier(.34,1.56,.64,1) both }
.anim-slide { animation: slide-up 0.3s ease both }

@media (prefers-reduced-motion: reduce) {
  .anim-pop, .anim-slide { animation: none }
  * { transition-duration: 0ms !important }
}

[hidden] { display: none !important }
</style>
</head>
<body>
<!-- ═══ MARKUP ═══ -->
<div class="wrap">

  <!-- Header -->
  <header class="header">
    <div class="logo">A Favor <span>o</span> En Contra</div>
    <div class="stats">
      <span class="stat stat-agree"  id="statAgree">🤝 0</span>
      <span class="stat-sep">·</span>
      <span class="stat stat-debate" id="statDebate">⚔️ 0</span>
    </div>
  </header>

  <!-- Progress -->
  <div class="progress"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

  <!-- Question card -->
  <div class="q-card anim-slide" id="qCard">
    <div class="q-index" id="qIndex">PREGUNTA 1 / 25</div>
    <div class="q-text" id="qText"></div>
    <div class="q-tag" id="qTag"></div>
  </div>

  <!-- Vote area -->
  <div class="vote-grid" id="voteGrid">
    <!-- Player 1 -->
    <div class="player-panel" id="panel1">
      <div class="p-label p-label-1">Jugador 1</div>
      <div class="vote-btns" id="btns1">
        <button class="btn-vote p1" onclick="castVote(1,'favor')">👍 A favor</button>
        <button class="btn-vote p1" onclick="castVote(1,'contra')">👎 En contra</button>
      </div>
      <div class="p-status" id="status1">Elige tu posición</div>
    </div>
    <!-- Player 2 -->
    <div class="player-panel" id="panel2">
      <div class="p-label p-label-2">Jugador 2</div>
      <div class="vote-btns" id="btns2">
        <button class="btn-vote p2" onclick="castVote(2,'favor')">👍 A favor</button>
        <button class="btn-vote p2" onclick="castVote(2,'contra')">👎 En contra</button>
      </div>
      <div class="p-status" id="status2">Elige tu posición</div>
    </div>
  </div>

  <!-- Reveal -->
  <div class="reveal-wrap" id="revealWrap">
    <button class="btn-reveal" id="btnReveal" onclick="revealVotes()" disabled>⚡ Revelar</button>
  </div>

  <!-- Result (injected) -->
  <div id="resultArea"></div>

  <!-- Next -->
  <button class="btn-next" id="btnNext" hidden onclick="nextQuestion()">Siguiente pregunta →</button>

  <!-- End screen (injected) -->
  <div id="endArea"></div>

</div>

<script>
const QUESTIONS = [
  { text: "¿La piña va en la pizza?", cat: "Comida" },
  { text: "¿Los celos son una muestra de amor?", cat: "Relaciones" },
  { text: "¿Las parejas deben compartir sus contraseñas?", cat: "Privacidad" },
  { text: "¿La infidelidad emocional es peor que la física?", cat: "Relaciones" },
  { text: "¿Está bien hacer spoilers sin advertir?", cat: "Entretenimiento" },
  { text: "¿Las mascotas deben dormir en la cama?", cat: "Hogar" },
  { text: "¿Se puede mantener contacto con ex-parejas?", cat: "Relaciones" },
  { text: "¿Las redes sociales arruinan las relaciones?", cat: "Tecnología" },
  { text: "¿Está bien mentir para no herir sentimientos?", cat: "Ética" },
  { text: "¿El matrimonio sigue siendo necesario?", cat: "Sociedad" },
  { text: "¿Se puede ser completamente feliz sin hijos?", cat: "Vida" },
  { text: "¿Los hombres deben pagar siempre en las citas?", cat: "Pareja" },
  { text: "¿Es normal ver series sin tu pareja?", cat: "Pareja" },
  { text: "¿El dinero en pareja debería ser completamente compartido?", cat: "Finanzas" },
  { text: "¿Está bien revisar el celular de tu pareja?", cat: "Privacidad" },
  { text: "¿El amor a primera vista existe?", cat: "Amor" },
  { text: "¿Las peleas frecuentes son señal de problemas graves?", cat: "Relaciones" },
  { text: "¿Los suegros deberían opinar en la relación?", cat: "Familia" },
  { text: "¿Las personas realmente cambian?", cat: "Filosofía" },
  { text: "¿Las fotos en redes sociales con tu pareja son necesarias?", cat: "Redes sociales" },
  { text: "¿El trabajo debería venir antes que los amigos?", cat: "Vida" },
  { text: "¿Hablar del pasado con tu pareja es siempre buena idea?", cat: "Pareja" },
  { text: "¿La compatibilidad importa más que el amor?", cat: "Amor" },
  { text: "¿Las relaciones a distancia realmente funcionan?", cat: "Relaciones" },
  { text: "¿Los videojuegos son una pérdida de tiempo?", cat: "Entretenimiento" },
  { text: "¿El dinero puede comprar la felicidad?", cat: "Filosofía" },
  { text: "¿Tener amigos del sexo opuesto en pareja puede ser un problema?", cat: "Pareja" },
  { text: "¿Las parejas deben tener exactamente los mismos amigos?", cat: "Pareja" },
  { text: "¿Está bien que tus amigos opinen sobre tu relación?", cat: "Amistad" },
  { text: "¿Trabajar desde casa es mejor que en oficina?", cat: "Trabajo" },
  { text: "¿El ghosting es una forma válida de terminar algo?", cat: "Relaciones" },
  { text: "¿Está bien seguir a tu ex en redes sociales?", cat: "Relaciones" },
  { text: "¿La monogamia es natural para los seres humanos?", cat: "Relaciones" },
  { text: "¿Es mejor vivir juntos antes de casarse?", cat: "Pareja" },
  { text: "¿Deberías decirle a tu mejor amigo si su pareja le es infiel?", cat: "Amistad" },
  { text: "¿El éxito profesional vale sacrificar la vida personal?", cat: "Trabajo" },
  { text: "¿La edad importa en una relación de pareja?", cat: "Relaciones" },
  { text: "¿Las parejas deben tener exactamente las mismas metas de vida?", cat: "Pareja" },
  { text: "¿El perdón genuino siempre es posible?", cat: "Filosofía" },
  { text: "¿Está bien que tu pareja tenga secretos contigo?", cat: "Pareja" },
  { text: "¿Es correcto juzgar a alguien por sus gustos musicales?", cat: "Entretenimiento" },
  { text: "¿Publicar fotos de tus hijos en redes sociales está bien?", cat: "Familia" },
  { text: "¿La suerte importa más que el esfuerzo para tener éxito?", cat: "Filosofía" },
  { text: "¿Deberías decirle a tu pareja si alguien te coquetea?", cat: "Pareja" },
  { text: "¿El horóscopo puede decir algo real sobre tu personalidad?", cat: "Creencias" },
  { text: "¿Las personas introvertidas son más reflexivas que las extrovertidas?", cat: "Personalidad" },
  { text: "¿El dinero cambia a las personas?", cat: "Filosofía" },
  { text: "¿Es correcto terminar una amistad por diferencias ideológicas?", cat: "Amistad" },
  { text: "¿Está bien no invitar a toda la familia a tu boda?", cat: "Familia" },
  { text: "¿Hay que decirle a alguien si tiene comida en los dientes?", cat: "Social" },
  { text: "¿Los tatuajes visibles afectan las oportunidades laborales?", cat: "Sociedad" },
  { text: "¿El primer amor es siempre el más importante?", cat: "Amor" },
  { text: "¿Es posible ser completamente honesto en una relación?", cat: "Pareja" },
  { text: "¿Está bien comer carne si te importa el medio ambiente?", cat: "Ética" },
  { text: "¿Los hijos deben saber siempre la verdad aunque duela?", cat: "Familia" },
  { text: "¿Está bien mentirle a tus papás siendo adulto?", cat: "Familia" },
  { text: "¿Las parejas deberían dormir siempre juntas en la misma cama?", cat: "Pareja" },
  { text: "¿El trabajo forma parte de la identidad de una persona?", cat: "Trabajo" },
  { text: "¿La amistad entre hombres y mujeres siempre tiene un límite?", cat: "Amistad" },
];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const TOTAL = 15;
let deck = [];
let cur = 0;
let votes = { 1: null, 2: null };
let score = { agree: 0, debate: 0 };
let revealed = false;

function init() {
  deck = shuffle(QUESTIONS).slice(0, TOTAL);
  cur = 0;
  votes = { 1: null, 2: null };
  score = { agree: 0, debate: 0 };
  revealed = false;
  updateStats();
  renderQuestion();
}

function updateStats() {
  document.getElementById('statAgree').textContent  = '🤝 ' + score.agree;
  document.getElementById('statDebate').textContent = '⚔️ ' + score.debate;
  document.getElementById('progressFill').style.width = (cur / TOTAL * 100) + '%';
}

function renderQuestion() {
  const q = deck[cur];
  document.getElementById('qIndex').textContent = `PREGUNTA ${cur + 1} / ${TOTAL}`;
  document.getElementById('qText').textContent  = q.text;
  document.getElementById('qTag').textContent   = q.cat;

  // Reset vote state
  votes = { 1: null, 2: null };
  revealed = false;

  // Reset player panels
  for (const p of [1, 2]) {
    const panel = document.getElementById('panel' + p);
    panel.classList.remove('ready-p1', 'ready-p2');

    document.getElementById('btns' + p).innerHTML =
      `<button class="btn-vote p${p}" onclick="castVote(${p},'favor')">👍 A favor</button>
       <button class="btn-vote p${p}" onclick="castVote(${p},'contra')">👎 En contra</button>`;

    document.getElementById('status' + p).textContent = 'Elige tu posición';
  }

  document.getElementById('btnReveal').disabled = true;
  document.getElementById('resultArea').innerHTML = '';
  document.getElementById('btnNext').hidden = true;
  document.getElementById('voteGrid').hidden  = false;
  document.getElementById('revealWrap').hidden = false;

  // Animate card in
  const card = document.getElementById('qCard');
  card.classList.remove('anim-slide');
  void card.offsetWidth;
  card.classList.add('anim-slide');
}

function castVote(player, choice) {
  if (votes[player] !== null || revealed) return;
  votes[player] = choice;

  const panel  = document.getElementById('panel' + player);
  const btnsEl = document.getElementById('btns' + player);
  const status = document.getElementById('status' + player);

  panel.classList.add('ready-p' + player);
  status.textContent = '✓ Voto registrado';

  // Replace buttons with sealed display — hides choice until reveal
  btnsEl.innerHTML =
    `<div class="voted-display voted-display-${player}">🔒 Esperando al otro...</div>`;

  if (votes[1] !== null && votes[2] !== null) {
    document.getElementById('status1').textContent = '¡Listos!';
    document.getElementById('status2').textContent = '¡Listos!';
    document.getElementById('btnReveal').disabled = false;
  }
}

function revealVotes() {
  if (!votes[1] || !votes[2]) return;
  revealed = true;

  document.getElementById('voteGrid').hidden   = true;
  document.getElementById('revealWrap').hidden = true;

  const v1 = votes[1];
  const v2 = votes[2];
  const agree = v1 === v2;

  if (agree) score.agree++;
  else       score.debate++;
  updateStats();

  const icon    = agree ? '🤝' : '⚔️';
  const verdict = agree ? '¡De acuerdo!' : '¡A debatir!';
  const cls     = agree ? 'agree' : 'disagree';
  const desc    = agree
    ? 'Los dos piensan igual. Cuenten por qué están de acuerdo.'
    : 'Opiniones opuestas. Tienen 2 minutos para convencerse mutuamente.';

  const choiceLabel = c => c === 'favor' ? '👍 A favor' : '👎 En contra';

  document.getElementById('resultArea').innerHTML = `
    <div class="result-card ${cls}-card anim-pop">
      <div class="result-icon">${icon}</div>
      <div class="result-verdict ${cls}-text">${verdict}</div>
      <div class="votes-row">
        <span class="vote-chip chip-p1">J1: ${choiceLabel(v1)}</span>
        <span class="vote-chip chip-p2">J2: ${choiceLabel(v2)}</span>
      </div>
      <div class="result-desc">${desc}</div>
    </div>`;

  document.getElementById('btnNext').hidden = false;
}

function nextQuestion() {
  cur++;
  if (cur >= TOTAL) {
    showEnd();
  } else {
    renderQuestion();
  }
}

function showEnd() {
  document.getElementById('qCard').hidden    = true;
  document.getElementById('voteGrid').hidden = true;
  document.getElementById('revealWrap').hidden = true;
  document.getElementById('resultArea').innerHTML = '';
  document.getElementById('btnNext').hidden  = true;
  document.getElementById('progressFill').style.width = '100%';

  const pct = Math.round(score.agree / TOTAL * 100);
  const msg = score.agree > score.debate
    ? '¡Mucho en común! Son más parecidos de lo que creen.'
    : score.debate > score.agree
      ? '¡Choque de ideas! Eso hace que la conversación nunca sea aburrida.'
      : 'Mitad acuerdos, mitad debates. Balance perfecto.';

  document.getElementById('endArea').innerHTML = `
    <div class="end-screen anim-pop">
      <div class="end-trophy">🏆</div>
      <div class="end-title">¡Juego terminado!</div>
      <div class="end-subtitle">${pct}% de las rondas estuvieron de acuerdo</div>
      <div class="end-stats">
        <div class="end-stat">
          <div class="end-num num-agree">${score.agree}</div>
          <div class="end-stat-lbl">De acuerdo</div>
        </div>
        <div class="end-stat">
          <div class="end-num num-disagree">${score.debate}</div>
          <div class="end-stat-lbl">Debates</div>
        </div>
      </div>
      <div class="end-msg">${msg}</div>
      <button class="btn-restart" onclick="restartGame()">Jugar de nuevo</button>
    </div>`;
}

function restartGame() {
  document.getElementById('qCard').hidden = false;
  document.getElementById('endArea').innerHTML = '';
  init();
}

init();
</script>
</body>
</html>
